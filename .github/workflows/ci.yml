name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      stage10_max_evidence_age_days:
        description: 'Maximum allowed age (days) for Stage 10 closeout evidence'
        required: false
        default: '30'

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    env:
      STAGE10_MAX_EVIDENCE_AGE_DAYS: ${{ github.event.inputs.stage10_max_evidence_age_days || vars.STAGE10_MAX_EVIDENCE_AGE_DAYS || '30' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect validator-impacting changes (PR fast mode)
        id: validator_changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_full_projection=1" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

          if echo "$changed_files" | grep -Eq '^(rules/|core/(validate|spec_reader)\.py|scripts/(check_global_validator_health|regenerate_global_validator_health_baseline|regenerate_rules_extraction_baseline|check_profile_budgets|generate_confidence_calibration|check_false_positive_budget|check_decision_explanations|check_semantic_equivalence|export_uncertain_rule_reviews|update_quality_trend_history|check_quality_trend_drift|build_quality_scorecard|build_rule_decision_diff|run_integrator_browser_regression|run_stage9_real_spec_batch)\.py|tests/test_(global_validator_health|rules_extraction_baseline_snapshot|validator_gold_dataset_precision|decision_explanations_contract|parsed_only_budget_guardrail|stability_dashboard|semantic_equivalence_check|export_uncertain_rule_reviews|spec_coverage_decision_outcomes)|results/ci/global_validator_health_baseline\.json)'; then
            echo "run_full_projection=1" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "run_full_projection=0" >> "$GITHUB_OUTPUT"
            echo "mode=fast" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run structure parity regression tests
        run: python -m pytest tests/test_web.py tests/test_report_format.py tests/test_structure_contract_fixtures.py -q

      - name: Run Stage 8 semantic regression gate
        run: python -m pytest tests/test_semantic_similarity.py tests/test_web.py tests/test_report_format.py tests/test_structure_contract_fixtures.py -q

      - name: Run Stage 8 semantic performance guardrail
        env:
          SEMANTIC_PERF_MEDIUM_MAX_SECONDS: "1.5"
          SEMANTIC_PERF_LARGE_MAX_SECONDS: "2.2"
        run: python -m pytest tests/test_semantic_performance_guardrail.py -q

      - name: Run Stage 8 baseline snapshot regression
        run: python -m pytest tests/test_stage8_baseline_snapshot.py -q

      - name: Run parser-validator sync and precedence gates (blocking)
        run: python -m pytest tests/test_parser_validator_sync_gate.py tests/test_pattern_family_precedence.py tests/test_stage10_parser_collapse_baseline_snapshot.py -q

      - name: Run validator exception lifecycle check
        run: python scripts/check_validator_exceptions.py --path rules/validator_exceptions.json

      - name: Run parser uncertainty budget check (INTTRA fixture)
        run: python scripts/check_parser_uncertainty_budget.py --report results/stage10_spec_coverage_inttra.json --max-ambiguities 0 --allowed-confidence high,medium

      - name: Run global parser quality check (blocking)
        if: github.event_name != 'pull_request' || steps.validator_changes.outputs.run_full_projection == '1'
        run: python scripts/check_global_parser_quality.py --rules-dir rules --allowed-confidence high,medium --max-ambiguities 0 --output results/ci/global_parser_quality.json --fail-on-findings

      - name: Run global validator health check (blocking)
        if: github.event_name != 'pull_request' || steps.validator_changes.outputs.run_full_projection == '1'
        run: python scripts/check_global_validator_health.py --rules-dir rules --baseline results/ci/global_validator_health_baseline.json --output results/ci/global_validator_health.json --max-p95-runtime-seconds 5.0 --fail-on-findings

      - name: Run profile budget check (blocking)
        if: github.event_name != 'pull_request' || steps.validator_changes.outputs.run_full_projection == '1'
        run: python scripts/check_profile_budgets.py --rules-dir rules --budgets rules/profile_budgets.json --output results/ci/profile_budget_report.json --fail-on-findings

      - name: Generate confidence calibration artifact
        run: python scripts/generate_confidence_calibration.py --output results/ci/confidence_calibration.json

      - name: Check false-positive budget (blocking)
        run: python scripts/check_false_positive_budget.py --calibration results/ci/confidence_calibration.json --max-false-positive-rate 0.08 --max-false-positive-count 25 --fail-on-findings

      - name: Run gold dataset precision gate (blocking)
        run: python -m pytest tests/test_validator_gold_dataset_precision.py -q

      - name: Skip full projection checks in PR fast mode
        if: github.event_name == 'pull_request' && steps.validator_changes.outputs.run_full_projection != '1'
        run: |
          echo "PR fast mode: skipping full projection checks because no validator-impacting files changed"

      - name: Refresh Stage 10 closeout evidence timestamp
        run: python scripts/refresh_stage10_release_evidence_timestamp.py --evidence results/ci/stage10_release_evidence.json

      - name: Check Stage 10 closeout evidence (blocking)
        run: python scripts/check_stage10_closeout_evidence.py --evidence results/ci/stage10_release_evidence.json --max-evidence-age-days $STAGE10_MAX_EVIDENCE_AGE_DAYS

      - name: Generate runtime INTTRA spec coverage report
        run: python main.py --spec "rules/Inttra-Contivo_X12_300_5030_to_JSON_BOOKINGINBOUND 1 Update.xlsx" --mode spec_coverage --report results/ci/stage10_spec_coverage_runtime.json

      - name: Run reason-code contract check (runtime report)
        run: python scripts/check_report_reason_codes.py --report results/ci/stage10_spec_coverage_runtime.json

      - name: Run decision explanation contract check (runtime report)
        run: python scripts/check_decision_explanations.py --report results/ci/stage10_spec_coverage_runtime.json

      - name: Run warning taxonomy contract check (runtime report)
        run: python scripts/check_warning_taxonomy.py --report results/ci/stage10_spec_coverage_runtime.json

      - name: Run semantic equivalence consistency check (runtime report)
        run: python scripts/check_semantic_equivalence.py --report results/ci/stage10_spec_coverage_runtime.json

      - name: Export uncertain decision review queue (runtime report)
        run: python scripts/export_uncertain_rule_reviews.py --report results/ci/stage10_spec_coverage_runtime.json --output results/ci/uncertain_rule_reviews.jsonl

      - name: Build unknown-rule triage artifact (runtime report)
        run: python scripts/build_unknown_rule_triage.py --report results/ci/stage10_spec_coverage_runtime.json --calibration results/ci/confidence_calibration.json --output results/ci/unknown_rule_triage.json --max-unknown-ratio 0.10

      - name: Report warning taxonomy drift (non-blocking)
        continue-on-error: true
        run: python scripts/check_warning_taxonomy_drift.py --report results/ci/stage10_spec_coverage_runtime.json --expected-strict 0 --expected-heuristic 0 --expected-informational 1 --expected-total 1

      - name: Update quality trend history
        run: python scripts/update_quality_trend_history.py --runtime-report results/ci/stage10_spec_coverage_runtime.json --calibration results/ci/confidence_calibration.json --history results/ci/quality_trend_history.json

      - name: Check quality trend drift (non-blocking)
        continue-on-error: true
        run: python scripts/check_quality_trend_drift.py --history results/ci/quality_trend_history.json --window 5

      - name: Run Stage 10 stabilization snapshot gates
        run: python -m pytest tests/test_stage10_spec_coverage_baseline_snapshot.py tests/test_stage10_inttra_pair_baseline_snapshot.py tests/test_stage10_parser_collapse_baseline_snapshot.py tests/test_stage10_closeout_evidence.py tests/test_rule_intent_golden_pack.py tests/test_backend_browser_decision_parity_contract.py tests/test_stability_dashboard.py tests/test_stabilization_guardrails.py tests/test_validator_exceptions_registry.py tests/test_report_reason_codes.py tests/test_warning_taxonomy_contract.py tests/test_warning_taxonomy_drift.py tests/test_parser_uncertainty_profiles.py tests/test_global_parser_quality.py tests/test_global_validator_health.py -q

      - name: Run global validator health snapshot gate
        if: github.event_name != 'pull_request' || steps.validator_changes.outputs.run_full_projection == '1'
        run: python -m pytest tests/test_global_validator_health_snapshot.py -q

      - name: Run full rules extraction baseline snapshot gate
        if: github.event_name != 'pull_request' || steps.validator_changes.outputs.run_full_projection == '1'
        run: python -m pytest tests/test_rules_extraction_baseline_snapshot.py -q

      - name: Run Stage 10 readiness checklist
        if: github.event_name != 'pull_request' || steps.validator_changes.outputs.run_full_projection == '1'
        run: python scripts/run_stage10_readiness_check.py

      - name: Run Stage 10 readiness checklist (PR fast mode)
        if: github.event_name == 'pull_request' && steps.validator_changes.outputs.run_full_projection != '1'
        env:
          SKIP_FULL_PROJECTION_GATES: "1"
        run: python scripts/run_stage10_readiness_check.py

      - name: Run integrator browser regression matrix (full projection)
        if: github.event_name != 'pull_request' || steps.validator_changes.outputs.run_full_projection == '1'
        run: |
          python scripts/run_integrator_browser_regression.py \
            --mode lenient \
            --batch-json-out results/ci/integrator_browser_batch_allpass.json \
            --coverage-json-out results/ci/integrator_browser_all_rules_coverage.json \
            --summary-json-out results/ci/integrator_browser_regression.json

      - name: Skip integrator browser regression matrix (PR fast mode)
        if: github.event_name == 'pull_request' && steps.validator_changes.outputs.run_full_projection != '1'
        run: |
          echo "PR fast mode: skipping integrator browser regression matrix because no validator-impacting files changed"

      - name: Build stabilization artifacts (non-blocking)
        shell: bash
        run: |
          mkdir -p results/ci
          python scripts/build_stability_dashboard.py \
            --report results/ci/stage10_spec_coverage_runtime.json \
            --output results/ci/stability_dashboard_inttra.json
          python scripts/build_rule_decision_diff.py \
            --baseline results/stage10_spec_coverage_baseline.json \
            --current results/ci/stage10_spec_coverage_runtime.json \
            --output results/ci/stage10_spec_coverage_decision_diff.json
          python scripts/build_shadow_delta.py \
            --strict-report results/ci/stage10_spec_coverage_runtime.json \
            --shadow-report results/ci/stage10_spec_coverage_runtime.json \
            --output results/ci/shadow_delta_inttra.json
          python scripts/build_quality_scorecard.py \
            --global-parser results/ci/global_parser_quality.json \
            --global-validator results/ci/global_validator_health.json \
            --calibration results/ci/confidence_calibration.json \
            --profile-budget results/ci/profile_budget_report.json \
            --unknown-triage results/ci/unknown_rule_triage.json \
            --trend results/ci/quality_trend_history.json \
            --output results/ci/quality_scorecard.json

      - name: Upload stabilization artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-artifacts
          path: |
            results/ci/*.json
            results/ci/*.jsonl
          if-no-files-found: warn

      - name: Run tests
        run: python -m pytest

      - name: Run API smoke test
        shell: bash
        run: |
          set -euo pipefail
          uvicorn api:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -sS -f -X POST "http://127.0.0.1:8000/validate" \
            -F "mapping_spec=@rules/spec.xlsx" \
            -F "input_payload=@samples/input.xml" \
            -F "output_payload=@samples/output.xml" \
            -o smoke_response.json

          python - <<'PY'
          import json
          with open('smoke_response.json', 'r', encoding='utf-8') as fh:
              payload = json.load(fh)

          if 'summary' not in payload or 'status' not in payload['summary']:
              raise SystemExit('Smoke test failed: summary.status missing')

          print('Smoke test OK:', payload['summary']['status'])
          PY

  browser-parity:
    runs-on: ubuntu-latest
    needs: test-and-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest playwright

      - name: Install browser runtime for parity tests
        run: python -m playwright install --with-deps chromium

      - name: Run lookup browser/python parity matrix (blocking)
        env:
          RUN_BROWSER_PARITY_TESTS: "1"
        run: python -m pytest tests/test_stage9_browser_python_parity.py -q -k lookup_table_browser_python_behavior_parity
