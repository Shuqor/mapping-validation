<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapping Validator</title>
  <style>
    :root {
      --bg-1: #f2f7ff;
      --bg-2: #ffffff;
      --ink: #1a2433;
      --muted: #5b6b7f;
      --brand: #0b7a75;
      --brand-2: #0f5257;
      --danger: #b42318;
      --warn: #b54708;
      --ok: #067647;
      --card: #ffffff;
      --line: #d8e1ee;
      --shadow: 0 14px 36px rgba(17, 37, 62, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, #e2f0ff 0, transparent 32%),
        radial-gradient(circle at 85% 88%, #d7f6ef 0, transparent 34%),
        linear-gradient(165deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
      padding: 28px 16px 40px;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .hero, .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 2vw, 2rem);
      letter-spacing: 0.2px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 760px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .span-2 { grid-column: span 2; }
    }

    label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input[type="file"], select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      color: var(--ink);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    button:hover { transform: translateY(-1px); }

    .btn-primary {
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
      color: #fff;
    }

    .btn-secondary {
      background: #eef5ff;
      color: #194276;
      border: 1px solid #d0e1f7;
    }

    .btn-secondary[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .status-pass { background: #e8f8f0; color: var(--ok); }
    .status-fail { background: #fdecea; color: var(--danger); }
    .status-warn { background: #fff2e0; color: var(--warn); }

    .muted { color: var(--muted); }

    .list {
      margin: 8px 0 0;
      padding-left: 18px;
    }

    .list li { margin-bottom: 6px; }

    .error-box {
      border: 1px solid #f3c7c4;
      background: #fff3f2;
      color: #7b1d18;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 10px;
      white-space: pre-wrap;
      display: none;
    }

    .hidden { display: none; }
  </style>
  <!-- GitHub Pages deployment enabled -->
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Mapping Validation Program</h1>
      <p>Upload mapping spec, source input XML, and target output XML. Validation runs locally in your browser and files are not uploaded to a server.</p>
    </section>

    <section class="panel">
      <form id="validate-form" class="grid">
        <div>
          <label for="mapping_spec">Mapping Spec (.xlsx, .xls, .csv)</label>
          <input id="mapping_spec" name="mapping_spec" type="file" accept=".xlsx,.xls,.csv" required />
        </div>

        <div>
          <label for="validation_mode">Validation Mode</label>
          <select id="validation_mode" name="validation_mode">
            <option value="strict" selected>Strict (fail on any issue)</option>
            <option value="lenient">Lenient (show warnings)</option>
          </select>
        </div>

        <div>
          <label for="input_payload">Input XML</label>
          <input id="input_payload" name="input_payload" type="file" accept=".xml" required />
        </div>

        <div>
          <label for="output_payload">Output XML</label>
          <input id="output_payload" name="output_payload" type="file" accept=".xml" required />
        </div>

        <div class="span-2 actions">
          <button class="btn-primary" id="submit-btn" type="submit">Validate Mapping</button>
          <button class="btn-secondary" id="download-btn" type="button" disabled>Download JSON Report</button>
        </div>
      </form>

      <div id="error-box" class="error-box"></div>
    </section>

    <section id="result-panel" class="panel hidden" aria-live="polite">
      <div id="status-wrap"></div>
      <h2 id="headline" style="margin:10px 0 4px;"></h2>
      <p id="meta" class="muted" style="margin:0 0 10px;"></p>

      <div>
        <h3 style="margin: 0 0 4px;">Issue Breakdown</h3>
        <ul id="breakdown-list" class="list"></ul>
      </div>

      <div>
        <h3 style="margin: 10px 0 4px;">Top Issues To Fix First</h3>
        <ul id="top-fixes-list" class="list"></ul>
      </div>
    </section>
  </main>

  <script src="vendor/xlsx.full.min.js"></script>
  <script>
    const form = document.getElementById('validate-form');
    const submitBtn = document.getElementById('submit-btn');
    const downloadBtn = document.getElementById('download-btn');
    const errorBox = document.getElementById('error-box');
    const resultPanel = document.getElementById('result-panel');
    const statusWrap = document.getElementById('status-wrap');
    const headline = document.getElementById('headline');
    const meta = document.getElementById('meta');
    const breakdownList = document.getElementById('breakdown-list');
    const topFixesList = document.getElementById('top-fixes-list');

    let lastResult = null;
    const HEADER_KEYWORDS = ['segment', 'xpath', 'cardinality', 'condition', 'description', 'value'];

    function setError(message) {
      errorBox.style.display = 'block';
      errorBox.textContent = message;
    }

    function clearError() {
      errorBox.style.display = 'none';
      errorBox.textContent = '';
    }

    function statusClass(status) {
      if (status === 'FAIL') return 'status-fail';
      if (status === 'PASS_WITH_WARNINGS') return 'status-warn';
      return 'status-pass';
    }

    function normalizeColumnName(value) {
      return String(value || '').trim().toLowerCase();
    }

    function cleanCell(value) {
      if (value === null || value === undefined) return '';
      return String(value).trim();
    }

    function hasNonEmptyValue(values) {
      return values.some((value) => cleanCell(value) !== '');
    }

    function firstNonEmptyValue(values) {
      for (const value of values) {
        const cleaned = cleanCell(value);
        if (cleaned) return cleaned;
      }
      return '';
    }

    function localName(tag) {
      if (!tag) return '';
      return tag.includes(':') ? tag.split(':').pop() : tag;
    }

    function normalizeXpath(xpath, rootName) {
      const trimmed = cleanCell(xpath);
      if (!trimmed) return '';
      if (trimmed.startsWith('/')) return trimmed;
      if (!trimmed.includes('/') && rootName) return `/${rootName}/${trimmed}`;
      return `/${trimmed}`;
    }

    function parseCardinality(cardinality) {
      const match = cleanCell(cardinality).match(/^(\d+)\s*\.\.\s*(\d+|N)$/i);
      if (!match) return null;
      const minCount = Number(match[1]);
      const maxCount = match[2].toUpperCase() === 'N' ? null : Number(match[2]);
      return { minCount, maxCount };
    }

    function isIfSourceMapRule(condition) {
      const normalized = cleanCell(condition).toLowerCase().replace(/\s+/g, ' ');
      return normalized.includes('if source') && normalized.includes('map source to target');
    }

    function extractConstantExpected(condition) {
      const text = cleanCell(condition);
      let match = text.match(/value\s+of\s+source\s*[\(:]?\s*"([^"]+)"/i);
      if (match) return match[1];
      match = text.match(/value\s+of\s+source\s*[\(:]?\s*'([^']+)'/i);
      if (match) return match[1];
      match = text.match(/value\s+of\s+source\s*[:=]\s*([^\s\)]+)/i);
      if (match) return match[1].replace(/^['"]|['"]$/g, '');
      return null;
    }

    function concatExpected(condition, sourceValues) {
      if (!sourceValues.length) return null;
      const match = cleanCell(condition).match(/concat(?:inate|enate)?\s*\(\s*"([^"]*)"\s*,\s*<[^>]+>\s*\)/i);
      if (!match) return null;
      return `${match[1]}${sourceValues[0]}`;
    }

    function errorRow(errorText) {
      const match = String(errorText).match(/Row\s+(\d+)/i);
      return match ? Number(match[1]) : 999999;
    }

    function sortedErrors(errors) {
      return [...errors].sort((a, b) => {
        const rowDelta = errorRow(a) - errorRow(b);
        return rowDelta !== 0 ? rowDelta : String(a).localeCompare(String(b));
      });
    }

    function buildTopCriticalErrors(errorSections, limit = 10) {
      const priority = [
        'source_target_missing',
        'cardinality_violations',
        'value_mismatches',
        'constant_mismatches',
        'concat_mismatches',
        'other',
      ];
      const top = [];
      for (const key of priority) {
        for (const err of sortedErrors(errorSections[key] || [])) {
          top.push(err);
          if (top.length >= limit) return top;
        }
      }
      return top;
    }

    function humanizeIssueText(errorText) {
      const sanitized = String(errorText).replace(/^Row\s+\d+\s*\|\s*/i, '').trim();
      const parts = sanitized.split('|').map((p) => p.trim());
      if (parts.length < 2) return sanitized;
      const target = parts[0].replace(/^Target:/i, '').trim();
      const message = parts[parts.length - 1];

      if (message === 'Source exists but target is missing') {
        return `Create target ${target} because source has a value.`;
      }

      const cardMatch = message.match(/Cardinality violation: expected\s+([^,]+),\s*got\s*(\d+)/i);
      if (cardMatch) {
        return `Fix target count at ${target}: expected ${cardMatch[1]}, but found ${cardMatch[2]}.`;
      }

      const valueMatch = message.match(/Value mismatch from source\s+([^:]+):\s*(.*?)\s*!=\s*(.*)/i);
      if (valueMatch) {
        return `Update mapping from ${valueMatch[1].trim()} to ${target}: expected '${valueMatch[2].trim()}' but found '${valueMatch[3].trim()}'.`;
      }

      const constantMatch = message.match(/Constant mismatch: expected\s*(.*?),\s*got\s*(.*)/i);
      if (constantMatch) {
        return `Set constant value at ${target}: expected '${constantMatch[1].trim()}' but found '${constantMatch[2].trim()}'.`;
      }

      const concatMatch = message.match(/Concat mismatch: expected\s*(.*?),\s*got\s*(.*)/i);
      if (concatMatch) {
        return `Fix concatenated value at ${target}: expected '${concatMatch[1].trim()}' but found '${concatMatch[2].trim()}'.`;
      }

      if (message === 'Required constant target is missing') {
        return `Create target ${target} for the required constant value.`;
      }

      if (message === 'Concat target is missing') {
        return `Create target ${target} for concatenated value output.`;
      }

      return `Fix mapping at ${target}: ${message}.`;
    }

    function humanIssueBreakdown(groupedErrorCounts) {
      const labels = {
        source_target_missing: 'Missing target when source has value',
        cardinality_violations: 'Cardinality mismatches',
        value_mismatches: 'Source and target value mismatches',
        constant_mismatches: 'Constant value mismatches',
        concat_mismatches: 'Concatenation mismatches',
        other: 'Other issues',
      };
      const orderedKeys = [
        'source_target_missing',
        'cardinality_violations',
        'value_mismatches',
        'constant_mismatches',
        'concat_mismatches',
        'other',
      ];
      const list = [];
      for (const key of orderedKeys) {
        const count = groupedErrorCounts[key] || 0;
        if (count > 0) list.push({ issue: labels[key], count });
      }
      return list;
    }

    function detectHeaderRow(rows) {
      for (let i = 0; i < rows.length; i += 1) {
        const rowText = rows[i].map((v) => String(v || '').toLowerCase()).join(' ');
        if (HEADER_KEYWORDS.some((keyword) => rowText.includes(keyword))) {
          return i;
        }
      }
      throw new Error('Could not detect header row in mapping spec');
    }

    function extractRules(rowObjects) {
      const targetCol = 'segment / field xpath';
      const sourceCol1 = 'xpath';
      const sourceCol2 = 'segment / field xpath.1';
      const cardinalityCol = 'cardinality';
      const conditionCol = 'condition';
      const noteCol = 'note';

      const rules = [];
      for (const row of rowObjects) {
        const targetXpath = cleanCell(row[targetCol]);
        if (!targetXpath) continue;

        const sourceXpath = cleanCell(row[sourceCol1]) || cleanCell(row[sourceCol2]);
        rules.push({
          target_xpath: targetXpath,
          source_xpath: sourceXpath,
          cardinality: cleanCell(row[cardinalityCol]),
          condition: cleanCell(row[conditionCol]),
          note: cleanCell(row[noteCol]),
        });
      }
      return rules;
    }

    async function readMappingRules(specFile) {
      if (typeof XLSX === 'undefined') {
        throw new Error('Spreadsheet parser failed to load. Refresh the page and try again.');
      }

      const ext = (specFile.name.split('.').pop() || '').toLowerCase();
      if (!['csv', 'xlsx', 'xls'].includes(ext)) {
        throw new Error('Invalid mapping spec type. Use .csv, .xlsx, or .xls');
      }

      const buffer = await specFile.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: 'array' });
      const sheetName = workbook.SheetNames.includes('Mapping') ? 'Mapping' : workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      if (!sheet) {
        throw new Error('No worksheet found in uploaded spec file');
      }

      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
      const headerRowIndex = detectHeaderRow(rows);
      const headers = rows[headerRowIndex].map(normalizeColumnName);
      const dataRows = rows.slice(headerRowIndex + 1);

      const rowObjects = dataRows
        .filter((row) => row.some((cell) => cleanCell(cell) !== ''))
        .map((row) => {
          const obj = {};
          headers.forEach((header, idx) => {
            obj[header] = cleanCell(row[idx]);
          });
          return obj;
        });

      return extractRules(rowObjects);
    }

    async function parseXmlFile(xmlFile) {
      const text = await xmlFile.text();
      const deNamespaced = text.replace(/\sxmlns="[^"]*"/g, '');
      const parser = new DOMParser();
      const doc = parser.parseFromString(deNamespaced, 'application/xml');
      if (doc.querySelector('parsererror')) {
        throw new Error(`Invalid XML in ${xmlFile.name}`);
      }
      return doc;
    }

    function xpathValues(doc, xpath) {
      if (!xpath) return [];
      let result;
      try {
        result = doc.evaluate(xpath, doc, null, XPathResult.ANY_TYPE, null);
      } catch (error) {
        return [];
      }

      const values = [];
      if (result.resultType === XPathResult.STRING_TYPE) {
        return [String(result.stringValue || '').trim()];
      }

      if (result.resultType === XPathResult.NUMBER_TYPE) {
        return [String(result.numberValue).trim()];
      }

      if (result.resultType === XPathResult.BOOLEAN_TYPE) {
        return [String(result.booleanValue).trim()];
      }

      let node = result.iterateNext();
      while (node) {
        if (node.nodeType === Node.ATTRIBUTE_NODE) {
          values.push(String(node.value || '').trim());
        } else {
          values.push(String(node.textContent || '').trim());
        }
        node = result.iterateNext();
      }
      return values;
    }

    async function validateLocally(specFile, inputFile, outputFile, validationMode) {
      const mode = String(validationMode || 'strict').toLowerCase();
      if (!['strict', 'lenient'].includes(mode)) {
        throw new Error('validation_mode must be either strict or lenient');
      }

      const rules = await readMappingRules(specFile);
      const srcDoc = await parseXmlFile(inputFile);
      const tgtDoc = await parseXmlFile(outputFile);
      const srcRootName = localName(srcDoc.documentElement.tagName);
      const tgtRootName = localName(tgtDoc.documentElement.tagName);

      const errors = [];
      let checkedRules = 0;
      const ruleStats = {
        cardinality_violations: 0,
        source_target_missing: 0,
        value_mismatches: 0,
        constant_mismatches: 0,
        concat_mismatches: 0,
      };
      const errorSections = {
        cardinality_violations: [],
        source_target_missing: [],
        value_mismatches: [],
        constant_mismatches: [],
        concat_mismatches: [],
        other: [],
      };
      const skippedRules = [];

      function addError(section, row, targetXpath, message) {
        const formatted = `Row ${row} | Target: ${targetXpath} | ${message}`;
        errors.push(formatted);
        errorSections[section].push(formatted);
      }

      rules.forEach((rule, index) => {
        const rowNum = index + 1;
        const tgt = normalizeXpath(rule.target_xpath, tgtRootName);
        const src = normalizeXpath(rule.source_xpath, srcRootName);
        const condText = cleanCell(rule.condition);
        const card = cleanCell(rule.cardinality);

        checkedRules += 1;

        const srcVals = src ? xpathValues(srcDoc, src) : [];
        const tgtVals = xpathValues(tgtDoc, tgt);

        const parsedCardinality = parseCardinality(card);
        if (parsedCardinality) {
          const targetCount = tgtVals.length;
          const tooFew = targetCount < parsedCardinality.minCount;
          const tooMany = parsedCardinality.maxCount !== null && targetCount > parsedCardinality.maxCount;
          if (tooFew || tooMany) {
            ruleStats.cardinality_violations += 1;
            addError('cardinality_violations', rowNum, tgt, `Cardinality violation: expected ${card}, got ${targetCount}`);
          }
        }

        let handledCondition = false;

        const isIfSourceRule = isIfSourceMapRule(condText);
        const isDirectMappingRule = Boolean(src) && (!cleanCell(condText) || isIfSourceRule);
        const srcHasValue = hasNonEmptyValue(srcVals);
        const tgtHasValue = hasNonEmptyValue(tgtVals);

        if (isIfSourceRule) {
          handledCondition = true;
        }

        if (isDirectMappingRule && srcHasValue) {
          if (!tgtHasValue) {
            ruleStats.source_target_missing += 1;
            addError('source_target_missing', rowNum, tgt, 'Source exists but target is missing');
          } else if (!condText.toLowerCase().includes('concat')) {
            const srcFirst = firstNonEmptyValue(srcVals);
            const tgtFirst = firstNonEmptyValue(tgtVals);
            if (srcFirst !== tgtFirst) {
              ruleStats.value_mismatches += 1;
              addError('value_mismatches', rowNum, tgt, `Value mismatch from source ${src}: ${srcFirst} != ${tgtFirst}`);
            }
          }
        }

        const constantExpected = extractConstantExpected(condText);
        if (constantExpected !== null) {
          handledCondition = true;
          if (!tgtHasValue) {
            ruleStats.constant_mismatches += 1;
            addError('constant_mismatches', rowNum, tgt, 'Required constant target is missing');
          } else if (firstNonEmptyValue(tgtVals) !== constantExpected) {
            ruleStats.constant_mismatches += 1;
            addError('constant_mismatches', rowNum, tgt, `Constant mismatch: expected ${constantExpected}, got ${firstNonEmptyValue(tgtVals)}`);
          }
        }

        const concatExp = concatExpected(condText, srcVals);
        if (concatExp !== null) {
          handledCondition = true;
          if (!tgtHasValue) {
            ruleStats.concat_mismatches += 1;
            addError('concat_mismatches', rowNum, tgt, 'Concat target is missing');
          } else if (firstNonEmptyValue(tgtVals) !== concatExp) {
            ruleStats.concat_mismatches += 1;
            addError('concat_mismatches', rowNum, tgt, `Concat mismatch: expected ${concatExp}, got ${firstNonEmptyValue(tgtVals)}`);
          }
        }

        if (condText && !handledCondition) {
          skippedRules.push({
            row: String(rowNum),
            target_xpath: tgt,
            reason: 'Unsupported condition pattern',
            condition: condText,
          });
        }
      });

      const strictWouldFail = errors.length > 0;
      const valid = mode === 'strict' ? !strictWouldFail : true;
      const groupedErrorCounts = Object.fromEntries(
        Object.entries(errorSections).map(([key, value]) => [key, value.length])
      );
      const topCriticalErrors = buildTopCriticalErrors(errorSections, 10);

      let status = 'PASS';
      if (mode === 'strict' && strictWouldFail) status = 'FAIL';
      if (mode === 'lenient' && strictWouldFail) status = 'PASS_WITH_WARNINGS';

      const warnings = [];
      if (checkedRules === 0) warnings.push('No rules were checked against the target XML');
      if (mode === 'lenient' && strictWouldFail) {
        warnings.push('Lenient mode enabled: validation contains errors but result is marked as valid');
      }
      if (skippedRules.length) warnings.push(`Skipped ${skippedRules.length} rule(s) due to unsupported conditions`);

      const reportId = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : `report-${Date.now()}`;

      return {
        report_version: '1.1',
        report_id: reportId,
        generated_at_utc: new Date().toISOString(),
        inputs: {
          spec_filename: specFile.name,
          input_filename: inputFile.name,
          output_filename: outputFile.name,
        },
        summary: {
          status,
          error_count: errors.length,
          grouped_error_counts: groupedErrorCounts,
          top_critical_errors: topCriticalErrors,
        },
        human_summary: {
          headline: errors.length === 0
            ? 'No mapping issues found'
            : `Found ${errors.length} mapping issue(s); fix the top items first`,
          what_to_fix_first: topCriticalErrors.map(humanizeIssueText),
          issue_breakdown: humanIssueBreakdown(groupedErrorCounts),
          checked_rules: checkedRules,
          skipped_rules: skippedRules.length,
        },
        valid,
        validation_mode: mode,
        strict_would_fail: strictWouldFail,
        checked_rules: checkedRules,
        warnings: warnings,
        rule_stats: ruleStats,
        skipped_rules: skippedRules,
        error_sections: errorSections,
        top_critical_errors: topCriticalErrors,
        error_count: errors.length,
        errors,
      };
    }

    function renderResult(payload) {
      const summary = payload.summary || {};
      const human = payload.human_summary || {};
      const status = summary.status || 'PASS';

      statusWrap.innerHTML = '';
      const badge = document.createElement('span');
      badge.className = `status-pill ${statusClass(status)}`;
      badge.textContent = status;
      statusWrap.appendChild(badge);

      headline.textContent = human.headline || 'Validation completed';
      meta.textContent = `Checked rules: ${human.checked_rules ?? payload.checked_rules ?? 0} | ` +
        `Skipped rules: ${human.skipped_rules ?? (payload.skipped_rules || []).length}`;

      breakdownList.innerHTML = '';
      const breakdown = human.issue_breakdown || [];
      if (breakdown.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'No issues found.';
        breakdownList.appendChild(li);
      } else {
        for (const item of breakdown) {
          const li = document.createElement('li');
          li.textContent = `${item.issue}: ${item.count}`;
          breakdownList.appendChild(li);
        }
      }

      topFixesList.innerHTML = '';
      const topFixes = human.what_to_fix_first || payload.top_critical_errors || [];
      if (topFixes.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'Nothing to fix.';
        topFixesList.appendChild(li);
      } else {
        for (const issue of topFixes) {
          const li = document.createElement('li');
          li.textContent = issue;
          topFixesList.appendChild(li);
        }
      }

      resultPanel.classList.remove('hidden');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();
      resultPanel.classList.add('hidden');
      downloadBtn.disabled = true;

      const specFile = document.getElementById('mapping_spec').files[0];
      const inputFile = document.getElementById('input_payload').files[0];
      const outputFile = document.getElementById('output_payload').files[0];
      const mode = document.getElementById('validation_mode').value;

      if (!specFile || !inputFile || !outputFile) {
        setError('Please select all required files before validating.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Validating...';

      try {
        const data = await validateLocally(specFile, inputFile, outputFile, mode);
        lastResult = data;
        downloadBtn.disabled = false;
        renderResult(data);
      } catch (error) {
        const detail = error && error.message ? error.message : String(error);
        setError(`Local validation failed: ${detail}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Validate Mapping';
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!lastResult) return;
      const blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      const reportId = lastResult.report_id || 'report';
      anchor.href = url;
      anchor.download = `validation_report_${reportId}.json`;
      anchor.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
